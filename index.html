<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hideout Editor</title>
    <!-- CSS only, no Bootstrap JavaScript. Pinned by version and by hash: the
         browser discards a stylesheet the CDN serves altered. Linked here
         rather than @imported from index.css because integrity is an attribute
         of <link>, and CSS @import cannot carry one. -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
      integrity="sha384-CK2SzKma4jA5H/MXDUU7i1TqZlCFaD4T01vtyDFvPlD97JQyS+IsSh1nI2EFbpyk"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body data-bs-theme="dark">
    <main></main>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
